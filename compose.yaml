name: writing-agent
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${WRITING_V2_DB_NAME:-writing_agent}
      POSTGRES_USER: ${WRITING_V2_DB_USER:-writing_app}
      POSTGRES_PASSWORD: ${WRITING_V2_DB_PASSWORD:?Set your own password in .env}
    ports:
      - "127.0.0.1:${WRITING_V2_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
